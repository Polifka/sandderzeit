name: Deploy to ALL-INKL

on:
  push:
    branches:
      - main  # Triggert bei jedem Push auf den main Branch
  schedule:
    - cron: '17 4 * * *'  # Täglich um 04:17 UTC neu bauen, damit neue Podcastfolgen erscheinen
  workflow_dispatch:      # Manuell starten über GitHub › Actions

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Code auschecken
        uses: actions/checkout@v4

      - name: 🟢 Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Abhängigkeiten installieren
        run: npm ci

      - name: 🔨 Produktions-Build erstellen
        run: npm run build

      - name: 🔑 KI-Zugang für das Thumbnail-Werkzeug hinterlegen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOOL_PASSWORD: ${{ secrets.TOOL_PASSWORD }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          KI_DAILY_LIMIT: ${{ vars.KI_DAILY_LIMIT }}
        run: node scripts/write-ki-config.mjs

      - name: 🚀 Per FTP zu ALL-INKL deployen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/         # Vite-Build-Ausgabe
          server-dir: /sandderzeit.de/ # Zielordner auf ALL-INKL angepasst
          dangerous-clean-slate: false
