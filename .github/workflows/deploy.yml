name: Deploy to ALL-INKL

on:
  push:
    branches:
      - main  # Triggert bei jedem Push auf den main Branch
  schedule:
    - cron: '17 4 * * *'  # Täglich um 04:17 UTC neu bauen, damit neue Podcastfolgen erscheinen
  workflow_dispatch:      # Manuell starten über GitHub › Actions

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Code auschecken
        uses: actions/checkout@v4

      - name: 🟢 Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Abhängigkeiten installieren
        run: npm ci

      - name: 🔨 Produktions-Build erstellen
        run: npm run build

      - name: ✉️ Mailjet-Konfiguration aus GitHub Secrets erzeugen
        if: ${{ secrets.MAILJET_API_KEY != '' && secrets.MAILJET_API_SECRET != '' }}
        env:
          MJ_KEY: ${{ secrets.MAILJET_API_KEY }}
          MJ_SECRET: ${{ secrets.MAILJET_API_SECRET }}
        run: |
          cat <<EOF > dist/mailjet-config.php
          <?php
          return [
              'api_key'    => '${MJ_KEY}',
              'api_secret' => '${MJ_SECRET}',
              'from_email' => 'info@sandderzeit.de',
              'from_name'  => 'Filip & Jan · Sand der Zeit',
              'list_id'    => 10648702,
              'site_url'   => 'https://sandderzeit.de',
          ];
          EOF

      - name: 🚀 Per FTP zu ALL-INKL deployen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/         # Vite-Build-Ausgabe
          server-dir: /sandderzeit.de/ # Zielordner auf ALL-INKL angepasst
          dangerous-clean-slate: false
